name: CI/CD

on:
  push:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        name: Checkout
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        name: Set up Python
        with:
          python-version: '3.13'
      - uses: pre-commit/action@v3.0.0
        name: Run pre-commit
        with:
          extra_args: --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        name: Checkout
      - uses: actions/setup-python@v4
        name: Set up Python
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: PYTHONPATH=. pytest

# Deployment is handled by Dokploy on the VPS via its GitHub push webhook
# (Docker build from the repo Dockerfile), so CI only lints and tests.
# The former AWS SAM deploy job was removed during the VPS migration; the AWS
# stack stays frozen until it is decommissioned (see docs/vps-migration.md, Phase 5).
