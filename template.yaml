AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MovGR API - Metro arrivals with DynamoDB caching

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

  ScrapeIntervalSeconds:
    Type: Number
    Default: 30
    MinValue: 5
    MaxValue: 300
    Description: How often to scrape metro data (in seconds). For intervals < 60s, uses Step Functions.

  UseStepFunctions:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Use Step Functions for sub-minute scraping intervals

  CorsOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated list of allowed CORS origins

Conditions:
  UseStepFunctionsCondition: !Equals [!Ref UseStepFunctions, "true"]
  UseEventBridgeCondition: !Equals [!Ref UseStepFunctions, "false"]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        AWS_REGION: !Ref AWS::Region
        DYNAMODB_TABLE_NAME: !Ref MetroArrivalsTable
        USE_DYNAMODB: "true"
        CORS_ORIGINS: !Ref CorsOrigins

Resources:
  # DynamoDB Table for storing metro arrivals
  MetroArrivalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub movgr-metro-arrivals-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: MovGR

  # Scraper Lambda Function - runs on schedule to fetch and cache metro data
  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub movgr-metro-scraper-${Environment}
      Handler: src.scraper.handler
      CodeUri: .
      Description: Scrapes metro arrival data and stores in DynamoDB
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MetroArrivalsTable
      Tags:
        Environment: !Ref Environment
        Application: MovGR

  # EventBridge schedule for scraper (used when interval >= 60 seconds)
  ScraperSchedule:
    Type: AWS::Events::Rule
    Condition: UseEventBridgeCondition
    Properties:
      Name: !Sub movgr-scrape-schedule-${Environment}
      Description: Triggers metro data scraping
      ScheduleExpression: !Sub rate(${ScrapeIntervalSeconds} seconds)
      State: ENABLED
      Targets:
        - Id: ScraperTarget
          Arn: !GetAtt ScraperFunction.Arn

  ScraperSchedulePermission:
    Type: AWS::Lambda::Permission
    Condition: UseEventBridgeCondition
    Properties:
      FunctionName: !Ref ScraperFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScraperSchedule.Arn

  # API Lambda Function - serves cached data to mobile apps
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub movgr-api-${Environment}
      Handler: src.app.handler
      CodeUri: .
      Description: MovGR API - serves metro arrival data
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MetroArrivalsTable
      Events:
        ApiGateway:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        RootPath:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
      Tags:
        Environment: !Ref Environment
        Application: MovGR

  # HTTP API Gateway
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - "*"

  # CloudWatch Log Groups with retention
  ScraperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/movgr-metro-scraper-${Environment}
      RetentionInDays: 14

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/movgr-api-${Environment}
      RetentionInDays: 14

  # Step Functions State Machine for sub-minute scraping
  ScraperStateMachine:
    Type: AWS::Serverless::StateMachine
    Condition: UseStepFunctionsCondition
    Properties:
      Name: !Sub movgr-scraper-loop-${Environment}
      Definition:
        Comment: Scrapes metro data every N seconds using a loop
        StartAt: Scrape
        States:
          Scrape:
            Type: Task
            Resource: !GetAtt ScraperFunction.Arn
            Next: Wait
            Catch:
              - ErrorEquals:
                  - States.ALL
                Next: Wait
          Wait:
            Type: Wait
            Seconds: !Ref ScrapeIntervalSeconds
            Next: ShouldContinue
          ShouldContinue:
            Type: Choice
            Choices:
              - Variable: $.continue
                BooleanEquals: false
                Next: Done
            Default: Scrape
          Done:
            Type: Succeed
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ScraperFunction
      Events:
        # Trigger state machine every 15 minutes to restart the loop
        ScheduledRestart:
          Type: Schedule
          Properties:
            Schedule: rate(14 minutes)
            Input: '{"continue": true}'
      Tags:
        Environment: !Ref Environment
        Application: MovGR

  # CloudWatch Alarm for scraper failures
  ScraperErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub movgr-scraper-errors-${Environment}
      AlarmDescription: Alarm when metro scraper has errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScraperFunction

Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

  DynamoDBTableName:
    Description: DynamoDB table name for metro arrivals
    Value: !Ref MetroArrivalsTable

  ScraperFunctionArn:
    Description: Scraper Lambda function ARN
    Value: !GetAtt ScraperFunction.Arn

  ApiFunctionArn:
    Description: API Lambda function ARN
    Value: !GetAtt ApiFunction.Arn

  StateMachineArn:
    Description: Step Functions state machine ARN (for sub-minute scraping)
    Condition: UseStepFunctionsCondition
    Value: !Ref ScraperStateMachine
